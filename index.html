<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCC · Quản lý trình duyệt Shopdrawing & Biện pháp thi công</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#38BDF8; --primary-dark:#0284C7; --primary-light:#0369A1;
    --cyan:#22D3EE;
    --bg:#0B0F19;          
    --surface:#111827;     
    --border:#374151;      
    --ink:#F9FAFB;         
    --ink-light:#9CA3AF;   
    --ink-faint:#6B7280;   
    --green:#34D399; --green-bg:#064E3B;
    --blue-bg:#1E3A8A;
    --amber:#FBBF24; --amber-bg:#451A03;
    --teal:#2DD4BF; --teal-bg:#042F2E;
    --gray-bg:#1F2937; --gray:#9CA3AF;
    --danger:#F87171; --danger-bg:#7F1D1D; --danger-dark:#FCA5A5;
    --radius:18px; --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Manrope', sans-serif; min-height:100vh;}
  .mono{font-family:'JetBrains Mono', monospace;}

  .hero{position:relative; background:linear-gradient(120deg, #0F172A 0%, #1E293B 50%, #334155 100%); color:#fff; padding:30px 32px 40px; overflow:hidden;}
  .hero::before{content:''; position:absolute; inset:0; background: radial-gradient(circle at 85% 15%, rgba(23,195,232,0.35), transparent 45%), radial-gradient(circle at 10% 90%, rgba(47,107,255,0.35), transparent 50%); pointer-events:none;}
  .hero-inner{position:relative; max-width:1220px; margin:0 auto;}
  .hero-top{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg, var(--cyan), var(--primary)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; letter-spacing:0.3px; box-shadow:0 6px 18px rgba(23,195,232,0.35); text-align:center; line-height:1.1;}
  .brand-text .eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#9FC3FF; font-weight:700;}
  .brand-text h1{margin:2px 0 0; font-size:20px; font-weight:800; letter-spacing:0.2px;}
  .hero-badge{font-size:12px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); padding:6px 14px; border-radius:999px; color:#DCE8FF; backdrop-filter:blur(6px); cursor:pointer;}
  .hero-stats{display:flex; gap:26px; margin-top:22px; flex-wrap:wrap;}
  .hero-stat .num{font-size:24px; font-weight:800; font-family:'JetBrains Mono',monospace;}
  .hero-stat .num.grad{background:linear-gradient(90deg,#fff,#BFE3FF); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero-stat .num.alert{color:#FF8A8A;}
  .hero-stat .lbl{font-size:11px; color:#B7C8E6; text-transform:uppercase; letter-spacing:0.6px; margin-top:2px;}

  .shell{max-width:1220px; margin:0 auto; padding:0 24px 60px;}
  .tabs{margin-top:-22px; position:relative; z-index:3; display:flex; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px; box-shadow:0 8px 24px rgba(15,27,45,0.08); width:fit-content; flex-wrap:wrap;}
  .tab-sep{width:1px; align-self:stretch; background:var(--border); margin:4px 2px;}
  .tab-btn{border:none; background:transparent; padding:10px 18px; border-radius:10px; font-weight:800; font-size:13.5px; color:var(--ink-light); cursor:pointer; display:flex; align-items:center; gap:7px;}
  .tab-btn.active{background:linear-gradient(120deg, var(--primary), #1E4FE0); color:#fff; box-shadow:0 6px 16px rgba(47,107,255,0.3);}
  .tab-count{font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.85;}

  .toolbar{margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .toolbar-row1{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .search-box{flex:1; min-width:240px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 16px; box-shadow:0 4px 14px rgba(15,27,45,0.05);}
  .search-box input{border:none; outline:none; flex:1; font-size:14px; font-family:'Manrope',sans-serif; background:transparent; color:var(--ink);}
  .search-box input::placeholder{color:var(--ink-faint);}
  .toolbar-row2{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .select-chip{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:9px 12px; font-size:12.5px; font-family:'Manrope',sans-serif; font-weight:600; color:var(--ink-light); cursor:pointer; outline:none;}

  .btn{border:none; border-radius:12px; padding:12px 18px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:'Manrope', sans-serif; transition:all .15s ease; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;}
  .btn-primary{background:linear-gradient(120deg, var(--primary), #0284C7); color:#0B0F19; box-shadow:0 8px 20px rgba(56,189,248,0.25);}
  .btn-primary:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn-cyan{background:linear-gradient(120deg, var(--cyan), #0FA9CC); color:#00323D; box-shadow:0 8px 18px rgba(23,195,232,0.3);}
  .btn-cyan:hover{filter:brightness(1.05); transform:translateY(-1px);}
  .btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--primary); color:var(--primary);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{background:var(--danger); color:#fff;}
  .btn-icon{padding:7px 10px; font-size:13px; border-radius:9px;}
  .btn-sm{padding:8px 13px; font-size:12.5px; border-radius:10px;}

  .auto-sync-status{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--green); font-weight:700; background:var(--green-bg); padding:8px 12px; border-radius:999px; margin-left:auto;}
  .auto-sync-status.updating{color:var(--amber); background:var(--amber-bg);}
  .auto-sync-status .pulse-dot{width:6px; height:6px; background:currentColor; border-radius:50%; animation:pulse 1.5s infinite;}

  .list-count{margin:16px 2px 10px; font-size:13px; color:var(--ink-light); font-weight:600; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .group-block{margin-bottom:16px;}
  .group-header{display:flex; align-items:center; gap:10px; padding:11px 14px; background:linear-gradient(120deg, #111827, #1E3A8A); border-radius:12px; cursor:pointer; color:#fff; user-select:none; border:1px solid var(--border);}
  .group-header .arrow{transition:transform .15s ease; font-size:12px;}
  .group-header.collapsed .arrow{transform:rotate(-90deg);}
  .group-name{font-weight:800; font-size:13.5px; font-family:'JetBrains Mono',monospace; letter-spacing:0.3px;}
  .group-count{font-size:11px; background:rgba(255,255,255,0.18); padding:2px 9px; border-radius:999px; font-family:'JetBrains Mono',monospace;}
  .group-overdue{font-size:11px; background:rgba(239,68,68,0.85); padding:2px 9px; border-radius:999px; font-weight:700;}
  .group-items{display:flex; flex-direction:column; gap:10px; margin-top:10px;}

  .doc-list{display:flex; flex-direction:column; gap:10px;}
  .doc-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 18px; cursor:pointer; transition:all .15s ease;}
  .doc-row:hover{border-color:var(--primary); box-shadow:0 8px 22px rgba(0,0,0,0.4); transform:translateY(-1px);}
  .doc-row.overdue{border-color:#7F1D1D; background:linear-gradient(135deg, #2A1215, #111827);}
  .doc-row-top{display:flex; align-items:flex-start; gap:14px;}
  .doc-row .stt{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--ink); background:#1F2937; min-width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--border);}
  .doc-main{flex:1; min-width:0;}
  .doc-title-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .doc-code{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:14.5px; color:var(--primary); background:#0369A133; padding:2px 10px; border-radius:7px; border:1px solid var(--primary-light);}
  .doc-name{font-weight:700; font-size:14.5px; color:var(--ink);}
  .doc-tag-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px;}
  .tag{font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; letter-spacing:0.2px;}
  .cat-tag{background:#3B0764; color:#E9D5FF;}
  .status-pending{background:var(--blue-bg); color:#93C5FD;}
  .status-approved{background:var(--green-bg); color:var(--green);}
  .status-approved-note{background:var(--teal-bg); color:var(--teal);}
  .status-rejected{background:var(--danger-bg); color:var(--danger-dark);}
  .status-none{background:var(--gray-bg); color:var(--gray);}
  .overdue-tag{background:var(--danger); color:#fff; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.7;}}
  .doc-row-actions{display:flex; gap:4px; flex-shrink:0;}
  .chevron{color:var(--ink-faint); font-size:18px; flex-shrink:0; align-self:center;}

  .row-info-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:12px;}
  .info-cell{background:#0B0F19; border:1px solid var(--border); border-radius:10px; padding:8px 10px;}
  .info-cell .info-lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-light); font-weight:700;}
  .info-cell .info-val{font-size:12.5px; font-weight:700; color:var(--ink); margin-top:2px; font-family:'JetBrains Mono',monospace;}
  .info-cell .info-val.danger{color:var(--danger-dark);}
  .info-cell .info-val.green{color:var(--green);}
  .doc-note-preview{font-size:12px; color:var(--ink-light); margin-top:10px; font-style:italic; display:flex; gap:6px;}
  .doc-desc{font-size:12.5px; color:var(--ink-light); margin-top:5px;}
  .doc-meta{display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .meta-item{font-size:11.5px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; display:flex; align-items:center; gap:4px;}
  .meta-item.danger{color:var(--danger-dark); font-weight:700;}
  .empty-state{padding:60px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px; background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius);}
  .empty-state .big{font-size:36px; margin-bottom:10px;}

  .back-btn{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:9px 14px; font-size:13px; font-weight:700; color:var(--ink-light); cursor:pointer; margin-top:16px;}
  .back-btn:hover{border-color:var(--primary); color:var(--primary);}
  .detail-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-top:16px; box-shadow:0 6px 24px rgba(15,27,45,0.05);}
  .detail-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .detail-title-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .detail-code{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:16px; color:var(--primary-dark); background:var(--primary-light); padding:3px 12px; border-radius:8px;}
  .detail-name{font-weight:800; font-size:19px; color:var(--ink);}
  .detail-desc{font-size:13.5px; color:var(--ink-light); margin-top:6px;}
  .detail-actions{display:flex; gap:8px; flex-shrink:0;}
  .detail-stats{display:flex; gap:22px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap;}
  .dstat .num{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:17px; color:var(--ink);}
  .dstat .num.danger{color:var(--danger-dark);}
  .dstat .lbl{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.4px;}
  .overdue-banner{margin-top:14px; background:var(--danger-bg); color:var(--danger-dark); padding:10px 14px; border-radius:11px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px;}

  .timeline-head{display:flex; justify-content:space-between; align-items:center; margin:26px 2px 14px;}
  .timeline-head h3{margin:0; font-size:14.5px; font-weight:800; color:var(--ink);}

  .round-timeline{position:relative; padding-left:30px;}
  .round-timeline::before{content:''; position:absolute; left:9px; top:8px; bottom:8px; width:2px; background:var(--border);}
  .round-node{position:relative; margin-bottom:14px;}
  .round-dot{position:absolute; left:-30px; top:16px; width:20px; height:20px; border-radius:50%; background:linear-gradient(120deg, var(--primary), #1E4FE0); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--border);}
  .round-node.latest .round-dot{background:linear-gradient(120deg, var(--cyan), #0FA9CC); box-shadow:0 0 0 1.5px var(--cyan);}
  .round-node.overdue .round-dot{background:linear-gradient(120deg, var(--danger), var(--danger-dark)); box-shadow:0 0 0 1.5px var(--danger);}
  .round-card{border:1px solid var(--border); border-radius:14px; padding:14px 16px; position:relative; background:#FCFDFF;}
  .round-node.latest .round-card{border-color:var(--cyan); background:linear-gradient(135deg, #F0FBFE, #FFFFFF); box-shadow:0 4px 16px rgba(23,195,232,0.12);}
  .round-node.overdue .round-card{border-color:#F5B8B8; background:linear-gradient(135deg, #FFF5F5, #FFFFFF); box-shadow:0 4px 16px rgba(239,68,68,0.12);}
  .round-card-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .round-badge-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .round-badge{display:inline-flex; align-items:center; justify-content:center; min-width:60px; height:28px; padding:0 11px; border-radius:9px; background:linear-gradient(120deg, var(--primary), #1E4FE0); color:#fff; font-family:'JetBrains Mono',monospace; font-weight:800; font-size:12px;}
  .round-node.latest .round-badge{background:linear-gradient(120deg, var(--cyan), #0FA9CC); color:#00323D;}
  .round-node.overdue .round-badge{background:linear-gradient(120deg, var(--danger), var(--danger-dark)); color:#fff;}
  .latest-tag{font-size:9.5px; background:var(--green-bg); color:var(--green); padding:3px 9px; border-radius:999px; font-weight:800; letter-spacing:0.3px;}
  .round-actions{display:flex; gap:4px;}
  .round-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:12px;}
  .round-field{background:#fff; border:1px solid var(--border); border-radius:10px; padding:8px 10px;}
  .round-field .lbl{font-size:10px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-faint); font-weight:700;}
  .round-field .val{font-size:13px; font-weight:700; color:var(--ink); margin-top:2px; font-family:'JetBrains Mono',monospace;}
  .round-overdue-note{margin-top:10px; background:var(--danger-bg); color:var(--danger-dark); padding:8px 12px; border-radius:9px; font-size:12.5px; font-weight:700;}
  .round-note{color:var(--ink); line-height:1.55; font-size:13.5px; margin-top:10px; white-space:pre-wrap;}
  .round-foot{display:flex; align-items:center; justify-content:space-between; margin-top:10px; flex-wrap:wrap; gap:8px;}
  .round-links{display:flex; gap:8px; flex-wrap:wrap;}
  .rlink{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--primary); background:var(--primary-light); padding:5px 11px; border-radius:999px; text-decoration:none;}
  .rlink:hover{background:var(--primary); color:#fff;}
  .rlink.approve{color:var(--green); background:var(--green-bg);}
  .rlink.approve:hover{background:var(--green); color:#fff;}
  .copy-btn{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; color:var(--ink-faint); background:var(--gray-bg); padding:5px 9px; border-radius:999px; border:none; cursor:pointer;}
  .copy-btn:hover{background:var(--border); color:var(--ink);}

  .modal-overlay{position:fixed; inset:0; background:rgba(9,17,32,0.55); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:#111827; border: 1px solid var(--border); border-radius:20px; overflow:hidden; width:100%; max-width:560px; box-shadow:0 24px 60px rgba(0,0,0,0.5); max-height:92vh; overflow-y:auto;}
  .modal-head{padding:20px 24px; background:linear-gradient(120deg, #0B0F19, #1E3A8A); color:#fff; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:2; border-bottom: 1px solid var(--border);}
  .modal-head h3{margin:0; font-size:15px; font-weight:800; letter-spacing:0.2px;}
  .modal-close{cursor:pointer; background:rgba(255,255,255,0.15); border:none; width:28px; height:28px; border-radius:8px; color:#fff; font-size:15px;}
  .modal-body{padding:22px 24px; display:flex; flex-direction:column; gap:15px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-light); margin-bottom:6px;}
  .field .optional{font-weight:500; color:var(--ink-faint); text-transform:none;}
  .field input, .field textarea, .field select{width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:11px; font-family:'Manrope',sans-serif; font-size:14px; resize:vertical; outline:none; transition:border-color .15s; background:#0B0F19; color: var(--ink);}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--primary);}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .cat-manage-row{display:flex; gap:8px;}
  .cat-manage-row select{flex:1;}
  .cat-list-manage{display:flex; flex-direction:column; gap:8px;}
  .group-manage-item{display:flex; align-items:center; gap:10px; background:#0B0F19; border:1px solid var(--border); border-radius:11px; padding:9px 12px;}
  .group-manage-item .gname{flex:1; font-weight:700; font-size:13.5px; color:var(--ink);}
  .group-manage-item .gcount{font-size:11px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace;}
  .group-manage-item button{border:none; background:var(--surface); width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--ink-light); border:1px solid var(--border);}
  .group-manage-item button:hover{border-color:var(--primary); color:var(--primary);}
  .group-manage-item button.gdel:hover{border-color:var(--danger); color:var(--danger);}
  .group-manage-empty{font-size:12.5px; color:var(--ink-faint); text-align:center; padding:14px;}
  .approver-block{border:1.5px solid var(--border); border-radius:13px; padding:14px; display:flex; flex-direction:column; gap:12px; background: #0B0F19;}
  .approver-block .approver-title{font-size:12.5px; font-weight:800; color:var(--primary); display:flex; align-items:center; gap:6px;}
  .modal-foot{padding:16px 24px 22px; display:flex; justify-content:flex-end; gap:10px; border-top: 1px solid var(--border);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--primary-dark); color:#fff; padding:11px 20px; border-radius:11px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:200; transition:all .25s ease; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .auth-area{display:flex; align-items:center; gap:10px;}
  .admin-pill{display:flex; align-items:center; gap:8px; font-size:12px; background:rgba(24,178,107,0.18); border:1px solid rgba(24,178,107,0.5); padding:6px 8px 6px 14px; border-radius:999px; color:#CFF7E2; font-weight:700;}
  .admin-pill .dot{width:7px; height:7px; border-radius:50%; background:#3CE29A; box-shadow:0 0 0 3px rgba(60,226,154,0.25);}
  .admin-logout-btn{border:none; background:rgba(255,255,255,0.18); color:#fff; font-size:11px; font-weight:800; padding:5px 10px; border-radius:999px; cursor:pointer;}
  .admin-logout-btn:hover{background:rgba(255,255,255,0.3);}
  .guest-banner{display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; background:var(--amber-bg); border:1px solid #F2D9A6; color:var(--amber); padding:10px 16px; border-radius:13px; font-size:12.5px; font-weight:700; margin-top:14px;}
  .guest-banner .link-btn{border:none; background:none; color:var(--primary); font-weight:800; cursor:pointer; text-decoration:underline; font-size:12.5px; padding:0;}
  .field-error{font-size:12px; color:var(--danger); font-weight:700; min-height:16px;}

  .scope-toggle{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .scope-chip{border:1.5px solid var(--border); background:var(--surface); padding:8px 16px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--ink-light); cursor:pointer;}

<script>
// ----- 1. HÀM XỬ LÝ CHỐNG LỖI CƠ BẢN -----
function safeJSONParse(str, fallback) {
    try {
        const parsed = JSON.parse(str);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
    } catch(e) { return fallback; }
}

// ----- 2. CẤU HÌNH LINK GOOGLE SHEET -----
const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSTsHC531V8MPYeQRUOIuSbuVYe2pPu0OdT-6gQBTZghIMVyfsQVs5rz5psvxXEgi-75hVTQHls9dB/pub?output=csv";

// ----- 3. TÍNH NĂNG TỰ ĐỘNG ĐỒNG BỘ 60 GIÂY -----
setInterval(() => {
  if (document.visibilityState === 'visible') {
    forceUpdateData(true);
  }
}, 60000);

async function forceUpdateData(isAuto = false) {
  const syncEl = document.getElementById('syncStatus');
  if(syncEl) syncEl.classList.add('updating');
  if(!isAuto) showToast('Đang làm mới dữ liệu...');
  
  await loadAll();
  render();
  
  setTimeout(() => {
    if(syncEl) syncEl.classList.remove('updating');
    if(!isAuto) showToast('Đã tải dữ liệu mới nhất!');
  }, 600);
}

// ----- 4. BIẾN TOÀN CỤC -----
const STORAGE_KEY = 'lhbimSubmittalData';
const CATEGORY_KEY = 'lhbimSubmittalCategories';
const GROUP_KEY = 'lhbimSubmittalGroups';
const SETTINGS_KEY = 'lhbimSubmittalSettings';
const PLAN_KEY = 'lhbimSubmittalPlans';
const MEMBER_KEY = 'lhbimSubmittalMembers';

let docs = [];
let categories = { shopdrawing: [], bienphap: [] };
let groups = { shopdrawing: [], bienphap: [] }; 
let plans = { shopdrawing: [], bienphap: [] }; 
let members = [];
let settings = { defaultSla: 7 };
let currentType = 'shopdrawing'; 
let currentView = 'docs'; 
let statsType = 'all'; 
let viewState = 'list';
let selectedId = null;
let editingRoundId = null;
let editingDocId = null;
let editingPlanId = null;
let searchTerm = '';
let filterStatus = 'all';
let filterCategory = 'all';
let filterGroup = 'all';
let sortMode = 'urgent';
let collapsedGroups = new Set();

const ADMIN_PASSWORD = 'admin123';
const ADMIN_SESSION_KEY = 'lhbimAdminSession';
let isAdmin = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1';

const TYPE_META = {
  shopdrawing: { label:'Shopdrawing', icon:'📐' },
  bienphap:    { label:'Biện pháp thi công', icon:'📋' }
};
const STATUS_META = {
  'cho-duyet':     { label:'Đang chờ duyệt', cls:'status-pending', icon:'⏳' },
  'da-duyet':      { label:'Đã duyệt', cls:'status-approved', icon:'✅' },
  'duyet-ghi-chu': { label:'Duyệt có ghi chú', cls:'status-approved-note', icon:'📝' },
  'khong-duyet':   { label:'Không duyệt', cls:'status-rejected', icon:'❌' }
};

function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }

// ----- 5. HÀM TẢI & BÓC TÁCH DỮ LIỆU ĐÃ SỬA LỖI 100% -----
async function loadAll(){
  // Tải danh mục trước để chống sập khi lọc
  const rawCats = safeJSONParse(localStorage.getItem(CATEGORY_KEY), null);
  categories = (rawCats && Array.isArray(rawCats.shopdrawing)) ? rawCats : { shopdrawing: ['Kết cấu', 'Hoàn thiện', 'Cơ điện (M&E)'], bienphap: ['An toàn lao động', 'Thi công phần ngầm'] };

  const rawGroups = safeJSONParse(localStorage.getItem(GROUP_KEY), null);
  groups = (rawGroups && Array.isArray(rawGroups.shopdrawing)) ? rawGroups : { shopdrawing: [], bienphap: [] };
  
  const rawMembers = safeJSONParse(localStorage.getItem(MEMBER_KEY), null);
  members = Array.isArray(rawMembers) ? rawMembers : ['KS. Minh Quân', 'KS. Văn Nam'];

  const rawSettings = safeJSONParse(localStorage.getItem(SETTINGS_KEY), null);
  settings = (rawSettings && typeof rawSettings.defaultSla === 'number') ? rawSettings : { defaultSla: 7 };

  const rawPlans = safeJSONParse(localStorage.getItem(PLAN_KEY), null);
  plans = (rawPlans && Array.isArray(rawPlans.shopdrawing)) ? rawPlans : { shopdrawing: [], bienphap: [] };

  try {
    const res = await fetch(GOOGLE_SHEET_CSV_URL);
    if (!res.ok) throw new Error("Network Error");
    const text = await res.text();
    
    // Nếu link trả về là HTML (lỗi không phải CSV)
    if (text.trim().toLowerCase().startsWith('<html') || text.trim().toLowerCase().startsWith('<!doctype')) {
        throw new Error("Lỗi định dạng trả về từ Google");
    }
    
    const parsedDocs = parseCSVToDocs(text);
    if(parsedDocs && parsedDocs.length > 0) {
      docs = parsedDocs; 
    } else {
      loadFromLocalStorage();
    }
  } catch(e) {
    loadFromLocalStorage(); 
  }
}

function loadFromLocalStorage() {
  const rawDocs = safeJSONParse(localStorage.getItem(STORAGE_KEY), []);
  docs = Array.isArray(rawDocs) ? rawDocs : [];
  docs.forEach((d,i)=>{
    if(!d.stt) d.stt = i+1;
    if(!d.rounds) d.rounds = [];
  });
}

function parseCSVToDocs(text) {
  const lines = text.split("\n");
  const docsMap = {}; 
  
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = [];
    let curr = '', inQuotes = false;
    for(let j=0; j<lines[i].length; j++){
       const char = lines[i][j];
       if(char === '"' && lines[i][j+1] === '"'){ curr += '"'; j++; }
       else if(char === '"'){ inQuotes = !inQuotes; }
       else if(char === ',' && !inQuotes){ cols.push(curr); curr = ''; }
       else { curr += char; }
    }
    cols.push(curr);
    
    if (cols.length < 5) continue;

    const code = (cols[1] || '').trim();
    const name = (cols[2] || '').trim();
    if(!name) continue;
    
    const groupName = (cols[3] || '').trim();
    let mappedGroupId = '';
    if(groupName) {
      // Đã fix lỗi undefined name khi tìm kiếm
      let g = groups['shopdrawing'].find(x => x && x.name && x.name.toLowerCase() === groupName.toLowerCase());
      if(!g) {
        g = { id: uid(), name: groupName };
        groups['shopdrawing'].push(g);
        saveGroups();
      }
      mappedGroupId = g.id;
    }
    
    const catName = (cols[4] || '').trim();
    if(catName && !categories['shopdrawing'].includes(catName)) {
      categories['shopdrawing'].push(catName);
      saveCategories();
    }
    
    const assigneeName = (cols[5] || '').trim();
    if(assigneeName && !members.includes(assigneeName)) {
      members.push(assigneeName);
      saveMembers();
    }

    const docKey = code + "_" + name;
    if (!docsMap[docKey]) {
      docsMap[docKey] = {
        id: uid(),
        stt: parseInt(cols[0]) || (Object.keys(docsMap).length + 1),
        type: 'shopdrawing',
        code: code,
        name: name,
        groupId: mappedGroupId,
        category: catName,
        assignee: assigneeName,
        desc: (cols[6] || '').trim(),
        rounds: []
      };
    }
    
    if ((cols[7] || '').trim()) {
       const pD = (d) => {
          if(!d) return '';
          let parts = d.split('/');
          if(parts.length===3) return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
          return d;
       };
       const getSt = (lbl) => {
          lbl = lbl || '';
          if(lbl.includes('Đã duyệt')) return 'da-duyet';
          if(lbl.includes('có ghi chú')) return 'duyet-ghi-chu';
          if(lbl.includes('Không duyệt')) return 'khong-duyet';
          return 'cho-duyet';
       };

       docsMap[docKey].rounds.push({
         id: uid(),
         submitDate: pD(cols[8]),
         slaDays: parseInt(cols[10]) || 7,
         tvgsStatus: getSt(cols[11]),
         tvgsDate: pD(cols[12]),
         tvgsLink: (cols[13] || '').trim(),
         bqlStatus: getSt(cols[14]),
         bqlDate: pD(cols[15]),
         bqlLink: (cols[16] || '').trim(),
         note: (cols[17] || '').trim(),
         fileLink: (cols[18] || '').trim(),
         createdAt: Date.now()
       });
    }
  }
  return Object.values(docsMap);
}

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function todayIso(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.floor((new Date(b) - new Date(a))/86400000); }
function addDays(iso, n){
  const dt = new Date(iso);
  dt.setDate(dt.getDate() + Number(n||0));
  return dt.toISOString().slice(0,10);
}

function sortedRounds(doc){
  if(!doc.rounds) return [];
  return [...doc.rounds].sort((a,b)=> (a.submitDate||'').localeCompare(b.submitDate||'') || a.createdAt - b.createdAt);
}
function latestRound(doc){
  const s = sortedRounds(doc);
  return s.length ? s[s.length-1] : null;
}
function overallStatus(round){
  if(!round) return null;
  if(round.tvgsStatus==='khong-duyet' || round.bqlStatus==='khong-duyet') return 'khong-duyet';
  if(round.tvgsStatus==='cho-duyet' || round.bqlStatus==='cho-duyet') return 'cho-duyet';
  if(round.tvgsStatus==='duyet-ghi-chu' || round.bqlStatus==='duyet-ghi-chu') return 'duyet-ghi-chu';
  return 'da-duyet';
}
function overallApprovalDate(round){
  const dates = [round.tvgsDate, round.bqlDate].filter(Boolean);
  if(!dates.length) return '';
  return dates.sort().reverse()[0];
}
function overdueDays(round){
  if(!round || overallStatus(round) !== 'cho-duyet') return 0;
  const dl = daysBetween(todayIso(), addDays(round.submitDate, round.slaDays||7));
  return dl < 0 ? -dl : 0;
}
function isDocOverdue(doc){
  const r = latestRound(doc);
  return r ? overdueDays(r) > 0 : false;
}
function docTypeCategories(type){ return categories[type] || []; }

function scopedDocs(){ return docs.filter(d=>d.type===currentType); }

function filteredDocs(){
  let list = scopedDocs();
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    list = list.filter(d =>
      (d.code||'').toLowerCase().includes(t) ||
      (d.name||'').toLowerCase().includes(t) ||
      (d.desc||'').toLowerCase().includes(t) ||
      (d.category||'').toLowerCase().includes(t) ||
      (d.assignee||'').toLowerCase().includes(t) ||
      (d.rounds||[]).some(r => (r.note||'').toLowerCase().includes(t))
    );
  }
  if(filterCategory !== 'all') list = list.filter(d => d.category === filterCategory);
  if(filterGroup !== 'all') list = list.filter(d => (d.groupId||'') === filterGroup);
  if(filterStatus !== 'all'){
    if(filterStatus === 'overdue'){
      list = list.filter(isDocOverdue);
    } else {
      list = list.filter(d=>{ const r = latestRound(d); return r && overallStatus(r) === filterStatus; });
    }
  }
  return list;
}
function sortDocsInPlace(list){
  if(sortMode === 'name'){
    list.sort((a,b)=> (a.name||'').localeCompare(b.name||''));
  } else if(sortMode === 'stt'){
    list.sort((a,b)=> (a.stt||0) - (b.stt||0));
  } else if(sortMode === 'updated'){
    list.sort((a,b)=>{
      const ra = latestRound(a), rb = latestRound(b);
      const da = ra ? ra.submitDate : '0000-00-00';
      const db = rb ? rb.submitDate : '0000-00-00';
      return db.localeCompare(da);
    });
  } else { 
    list.sort((a,b)=> urgencyScore(a) - urgencyScore(b));
  }
  return list;
}
function urgencyScore(doc){
  const r = latestRound(doc);
  if(!r) return 900000;
  if(overallStatus(r) === 'cho-duyet'){
    const od = overdueDays(r);
    if(od > 0) return -100000 - od;
    return daysBetween(todayIso(), addDays(r.submitDate, r.slaDays||7));
  }
  return 500000 - new Date(r.responseDate || r.submitDate || 0).getTime()/86400000000;
}
const UNGROUPED_KEY = '__ungrouped__';
function groupedDocs(){
  const list = filteredDocs();
  const buckets = {};
  list.forEach(d=>{
    const key = d.groupId && groupById(currentType, d.groupId) ? d.groupId : UNGROUPED_KEY;
    if(!buckets[key]) buckets[key] = [];
    buckets[key].push(d);
  });
  const definedGroups = docTypeGroups(currentType);
  const ordered = [];
  definedGroups.forEach(g=>{
    if(buckets[g.id]) ordered.push({ key: g.id, label: g.name, items: sortDocsInPlace(buckets[g.id]) });
  });
  if(buckets[UNGROUPED_KEY]) ordered.push({ key: UNGROUPED_KEY, label: '— Chưa phân nhóm —', items: sortDocsInPlace(buckets[UNGROUPED_KEY]) });
  return ordered;
}

function barRow(label, value, max, color, suffix){

  const pct = max>0 ? Math.min(100, Math.round((value/max)*100)) : 0;

    <div class="stat-bar-value">${value}${suffix}</div>
  </div>`;
}
function renderStatsView(){
  const list = statsType==='all' ? docs.slice() : docs.filter(d=>d.type===statsType);
  const totalDocs = list.length;
  const noRoundsCount = list.filter(d=>!d.rounds || d.rounds.length===0).length;
  const statusCounts = { 'cho-duyet':0, 'da-duyet':0, 'duyet-ghi-chu':0, 'khong-duyet':0 };
  list.forEach(d=>{
    const r = latestRound(d);
    if(r){ const st = overallStatus(r); statusCounts[st] = (statusCounts[st]||0)+1; }
  });
  const overdueCount = list.filter(isDocOverdue).length;
  const approvedCount = statusCounts['da-duyet'] + statusCounts['duyet-ghi-chu'];

  const groupOverdueMap = {};
  list.forEach(d=>{
    if(isDocOverdue(d)){
      const g = d.groupId ? groupById(d.type, d.groupId) : null;
      const key = g ? (d.type+'::'+g.id) : (d.type+'::ungrouped');
      const label = (g ? g.name : '— Chưa phân nhóm —') + (statsType==='all' ? ` · ${TYPE_META[d.type].label}` : '');
      if(!groupOverdueMap[key]) groupOverdueMap[key] = { label, count:0 };
      groupOverdueMap[key].count++;
    }
  });
  const groupOverdueList = Object.values(groupOverdueMap).sort((a,b)=>b.count-a.count).slice(0,8);

  let tvgsPending=0, bqlPending=0, tvgsOverdue=0, bqlOverdue=0;
  const tvgsDurations=[], bqlDurations=[];
  list.forEach(d=>{
    const r = latestRound(d);
    if(r){
      const od = overdueDays(r);
      if(r.tvgsStatus==='cho-duyet'){ tvgsPending++; if(od>0) tvgsOverdue++; }
      if(r.bqlStatus==='cho-duyet'){ bqlPending++; if(od>0) bqlOverdue++; }
    }
    if(d.rounds) {
      d.rounds.forEach(rr=>{
        if(rr.tvgsDate) tvgsDurations.push(daysBetween(rr.submitDate, rr.tvgsDate));
        if(rr.bqlDate) bqlDurations.push(daysBetween(rr.submitDate, rr.bqlDate));
      });
    }
  });
  const avg = arr => arr.length ? Math.round((arr.reduce((s,x)=>s+x,0)/arr.length)*10)/10 : null;
  const tvgsAvg = avg(tvgsDurations);
  const bqlAvg = avg(bqlDurations);

  const topOverdue = list.filter(isDocOverdue)
    .map(d=>({ d, od: overdueDays(latestRound(d)) }))
    .sort((a,b)=>b.od-a.od).slice(0,6);

  const memberMap = {};
  list.forEach(d => {
    const m = d.assignee ? d.assignee.trim() : 'Chưa phân công';
    if(!memberMap[m]) memberMap[m] = { total: 0, approved: 0, pending: 0, overdue: 0 };
    memberMap[m].total++;
    const r = latestRound(d);
    if(r) {
      const st = overallStatus(r);
      if(st === 'da-duyet' || st === 'duyet-ghi-chu') memberMap[m].approved++;
      else if(st === 'cho-duyet') {
        memberMap[m].pending++;
        if(overdueDays(r) > 0) memberMap[m].overdue++;
      }
    }
  });

  let memberHtml = Object.keys(memberMap).sort((a,b) => memberMap[b].total - memberMap[a].total).map(name => {
    const data = memberMap[name];
    const pct = data.total > 0 ? (data.approved / data.total) * 100 : 0;
    return `<div class="stat-bar-row">
      <div class="stat-bar-label" style="width:160px;">👤 ${escapeHtml(name)}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width: ${pct}%; background:var(--green);"></div></div>
      <div class="stat-bar-value" style="width:90px;">✅ ${data.approved}/${data.total}</div>
      ${data.overdue > 0 ? `<div class="stat-bar-value" style="width:50px; color:var(--danger); font-size:11px;">🔴 ${data.overdue}</div>` : `<div style="width:50px;"></div>`}
    </div>`;
  }).join('');

  let insight = '';
  if(tvgsAvg!==null && bqlAvg!==null && tvgsAvg!==bqlAvg){
    const slower = tvgsAvg > bqlAvg ? 'TVGS' : 'BQL', faster = tvgsAvg > bqlAvg ? 'BQL' : 'TVGS';
    const slowerAvg = Math.max(tvgsAvg,bqlAvg), fasterAvg = Math.min(tvgsAvg,bqlAvg);
    insight += `⏱️ <b>${slower}</b> hiện là bên duyệt chậm hơn — trung bình <b>${slowerAvg} ngày</b>, so với <b>${fasterAvg} ngày</b> của ${faster}. `;
  } else if(tvgsAvg!==null && bqlAvg!==null){
    insight += `⏱️ Tốc độ duyệt của TVGS và BQL hiện tương đương nhau (~${tvgsAvg} ngày/lượt). `;
  } else if(tvgsAvg!==null || bqlAvg!==null){
    insight += `⏱️ Hiện chỉ đủ dữ liệu thời gian duyệt cho ${tvgsAvg!==null?'TVGS':'BQL'} (~${tvgsAvg??bqlAvg} ngày/lượt). `;
  }
  if(tvgsOverdue || bqlOverdue){
    if(tvgsOverdue > bqlOverdue) insight += `🔴 <b>TVGS</b> đang giữ nhiều hồ sơ quá hạn nhất (${tvgsOverdue} hồ sơ, BQL: ${bqlOverdue}).`;
    else if(bqlOverdue > tvgsOverdue) insight += `🔴 <b>BQL</b> đang giữ nhiều hồ sơ quá hạn nhất (${bqlOverdue} hồ sơ, TVGS: ${tvgsOverdue}).`;
    else insight += `🔴 Cả TVGS và BQL đều đang giữ ${tvgsOverdue} hồ sơ quá hạn.`;
  } else if(insight){
    insight += `✅ Hiện không có hồ sơ nào quá hạn ở cả hai bên.`;
  }
  if(!insight) insight = 'Chưa đủ dữ liệu để đưa ra nhận định — hãy cập nhật thêm các vòng trình duyệt.';

  const maxStatus = Math.max(1, ...Object.values(statusCounts), noRoundsCount);
  const maxGroupOverdue = Math.max(1, ...groupOverdueList.map(g=>g.count), 1);
  const maxPending = Math.max(1, tvgsPending, bqlPending);
  const maxSideOverdue = Math.max(1, tvgsOverdue, bqlOverdue);
  const maxAvg = Math.max(1, tvgsAvg||0, bqlAvg||0);

  const scopeToggle = `<div class="scope-toggle">
      <button class="scope-chip ${statsType==='all'?'active':''}" onclick="switchStatsType('all')">🧮 Tất cả</button>
      ${Object.keys(TYPE_META).map(t=>`<button class="scope-chip ${statsType===t?'active':''}" onclick="switchStatsType('${t}')">${TYPE_META[t].icon} ${TYPE_META[t].label}</button>`).join('')}
    </div>`;

  const kpiRow = `<div class="stat-kpi-row">
      <div class="stat-kpi"><div class="num">${totalDocs}</div><div class="lbl">Tổng hồ sơ</div></div>
      <div class="stat-kpi"><div class="num green">${approvedCount}</div><div class="lbl">Đã duyệt</div></div>
      <div class="stat-kpi"><div class="num">${statusCounts['cho-duyet']}</div><div class="lbl">Đang chờ duyệt</div></div>
      <div class="stat-kpi"><div class="num danger">${overdueCount}</div><div class="lbl">🔴 Quá hạn</div></div>
      <div class="stat-kpi"><div class="num">${statusCounts['khong-duyet']}</div><div class="lbl">Không duyệt</div></div>
    </div>`;

  if(totalDocs===0){
    return scopeToggle + kpiRow + `<div class="empty-state"><div class="big">📊</div>Chưa có dữ liệu ${statsType==='all'?'':TYPE_META[statsType].label+' '}để thống kê.</div>`;
  }

  return `
    <button class="btn btn-cyan" onclick="forceUpdateData()" style="margin-bottom: 14px;">🔄 Làm mới dữ liệu thống kê</button>
    ${scopeToggle}
    ${kpiRow}
    <div class="stat-card">
      <h3>💡 Nhận định nhanh</h3>
      <div class="insight-box">${insight}</div>
    </div>
    
    <div class="stat-card">
      <h3>👥 Khối lượng công việc theo Thành viên</h3>
      <div class="sub-lbl" style="margin-top:0; margin-bottom:12px;">Số lượng hồ sơ đang phụ trách (Đã duyệt / Tổng)</div>
      ${memberHtml || '<div class="group-manage-empty">Chưa có thành viên nào được phân công.</div>'}
    </div>

    <div class="stat-grid-2">
      <div class="stat-card">
        <h3>📊 Phân bố tình trạng hồ sơ</h3>
        ${barRow('⏳ Đang chờ duyệt', statusCounts['cho-duyet'], maxStatus, 'linear-gradient(90deg,var(--primary),var(--primary-dark))')}
        ${barRow('✅ Đã duyệt', statusCounts['da-duyet'], maxStatus, 'linear-gradient(90deg,var(--green),#0E9A5A)')}
        ${barRow('📝 Duyệt có ghi chú', statusCounts['duyet-ghi-chu'], maxStatus, 'linear-gradient(90deg,var(--teal),#0B8080)')}
        ${barRow('❌ Không duyệt', statusCounts['khong-duyet'], maxStatus, 'linear-gradient(90deg,var(--danger),var(--danger-dark))')}
        ${barRow('— Chưa trình', noRoundsCount, maxStatus, 'linear-gradient(90deg,var(--gray),#525A68)')}
      </div>
      <div class="stat-card">
        <h3>⚖️ So sánh tiến độ TVGS vs Ban quản lý</h3>
        <div class="sub-lbl">Đang chờ duyệt (số hồ sơ)</div>
        ${barRow('🧭 TVGS', tvgsPending, maxPending, 'linear-gradient(90deg,var(--primary),var(--primary-dark))')}
        ${barRow('🏢 Ban quản lý', bqlPending, maxPending, 'linear-gradient(90deg,var(--cyan),#0FA9CC)')}
        <div class="sub-lbl">Đang quá hạn (số hồ sơ)</div>
        ${barRow('🧭 TVGS', tvgsOverdue, maxSideOverdue, 'linear-gradient(90deg,var(--danger),var(--danger-dark))')}
        ${barRow('🏢 Ban quản lý', bqlOverdue, maxSideOverdue, 'linear-gradient(90deg,var(--danger),var(--danger-dark))')}
        <div class="sub-lbl">Thời gian duyệt trung bình</div>
        ${barRow('🧭 TVGS', tvgsAvg||0, maxAvg, 'linear-gradient(90deg,var(--amber),#C97F00)', tvgsAvg===null?' chưa có DL':' ngày')}
        ${barRow('🏢 Ban quản lý', bqlAvg||0, maxAvg, 'linear-gradient(90deg,var(--amber),#C97F00)', bqlAvg===null?' chưa có DL':' ngày')}
      </div>
    </div>
    <div class="stat-card">
      <h3>🗂️ Nhóm có nhiều hồ sơ quá hạn nhất</h3>
      ${groupOverdueList.length ? groupOverdueList.map(g=>barRow(g.label, g.count, maxGroupOverdue, 'linear-gradient(90deg,var(--danger),var(--danger-dark))')).join('') : `<div class="group-manage-empty">🎉 Không có nhóm nào đang quá hạn.</div>`}
    </div>
    <div class="stat-card">
      <h3>🔴 Hồ sơ quá hạn nhiều nhất</h3>
      ${topOverdue.length ? `<div class="doc-list">${topOverdue.map(({d,od})=>`
        <div class="doc-row overdue" onclick="goToDetailFromStats('${d.id}')">
          <div class="doc-row-top">
            <div class="stt">${d.stt}</div>
            <div class="doc-main">
              <div class="doc-title-row">
                <span class="doc-code">${escapeHtml(d.code||'(chưa có mã)')}</span>
                <span class="doc-name">${escapeHtml(d.name)}</span>
              </div>
              <div class="doc-tag-row">
                <span class="tag cat-tag">${TYPE_META[d.type].icon} ${TYPE_META[d.type].label}</span>
                <span class="tag overdue-tag">🔴 Quá hạn ${od} ngày</span>
              </div>
            </div>
            <div class="chevron">›</div>
          </div>
        </div>`).join('')}</div>` : `<div class="group-manage-empty">🎉 Không có hồ sơ nào đang quá hạn.</div>`}
    </div>
  `;
}

function planItemStatus(p){
  if(p.linkedDocId){
    const d = docs.find(x=>x.id===p.linkedDocId);
    if(!d || !d.rounds || !d.rounds.length) return { code:'chua-trinh', approvedDate:null };
    const r = latestRound(d);
    const ost = overallStatus(r);
    if(ost==='da-duyet' || ost==='duyet-ghi-chu') return { code:'hoan-thanh', approvedDate: overallApprovalDate(r) };
    return { code:'dang-xu-ly', approvedDate:null };
  }
  return { code: p.manualStatus || 'chua-trinh', approvedDate:null };
}
function planRowState(p){
  const st = planItemStatus(p);
  const today = todayIso();
  const isDone = st.code === 'hoan-thanh';
  const overdueVsPlan = !isDone && today > p.plannedDate;
  const daysLate = overdueVsPlan ? daysBetween(p.plannedDate, today) : 0;
  const daysLeft = !isDone && !overdueVsPlan ? daysBetween(today, p.plannedDate) : 0;
  let completedLate = false, completedLateDays = 0;
  if(isDone && st.approvedDate && st.approvedDate > p.plannedDate){
    completedLate = true;
    completedLateDays = daysBetween(p.plannedDate, st.approvedDate);
  }
  return Object.assign({}, st, { isDone, overdueVsPlan, daysLate, daysLeft, completedLate, completedLateDays });
}
function renderPlanRow(p, s){
  const g = p.groupId ? groupById(currentType, p.groupId) : null;
  const linkedDoc = p.linkedDocId ? docs.find(x=>x.id===p.linkedDocId) : null;
  const linkedRoundCount = linkedDoc ? sortedRounds(linkedDoc).length : 0;
  let statusTag;
  if(s.isDone){
    statusTag = s.completedLate
      ? `<span class="tag status-rejected">⚠️ Hoàn thành trễ ${s.completedLateDays} ngày</span>`
      : `<span class="tag status-approved">✅ Hoàn thành đúng/trước hạn</span>`;
  } else if(s.overdueVsPlan){
    statusTag = `<span class="tag overdue-tag">🔴 Trễ kế hoạch ${s.daysLate} ngày</span>`;
  } else if(s.daysLeft<=7){
    statusTag = `<span class="tag status-pending">⏳ Còn ${s.daysLeft} ngày</span>`;
  } else {
    statusTag = `<span class="tag status-none">Còn ${s.daysLeft} ngày</span>`;
  }
  const processTag = !s.isDone
    ? (s.code==='dang-xu-ly' ? `<span class="tag status-pending">🔄 Đang xử lý</span>` : `<span class="tag status-none">Chưa trình</span>`)
    : '';

  return `
    <div class="doc-row ${s.overdueVsPlan?'overdue':''}" ${linkedDoc ? `onclick="goToDetailFromStats('${linkedDoc.id}')"` : 'style="cursor:default;"'}>
      <div class="doc-row-top">
        <div class="stt">🗓️</div>
        <div class="doc-main">
          <div class="doc-title-row">
            ${p.code ? `<span class="doc-code">${escapeHtml(p.code)}</span>` : ''}
            <span class="doc-name">${escapeHtml(p.title)}</span>
          </div>
          <div class="doc-tag-row">
            ${g ? `<span class="tag cat-tag">${escapeHtml(g.name)}</span>` : ''}
            ${statusTag}
            ${processTag}
            ${linkedDoc ? `<span class="tag status-approved-note">🔗 Liên kết hồ sơ</span>` : ''}
            ${linkedRoundCount ? `<span class="tag cat-tag">🔁 Đang ở Lần ${linkedRoundCount}${s.isDone?'':' (chờ phản hồi)'}</span>` : ''}
          </div>
          <div class="row-info-grid">
            <div class="info-cell"><div class="info-lbl">Người thực hiện</div><div class="info-val" style="color:var(--cyan);">${escapeHtml(p.assignee || 'Chưa phân công')}</div></div>
            <div class="info-cell"><div class="info-lbl">Ngày kế hoạch</div><div class="info-val">${fmtDate(p.plannedDate)}</div></div>
            ${linkedDoc ? `<div class="info-cell"><div class="info-lbl">Hồ sơ liên kết</div><div class="info-val" style="font-size:11px;">${escapeHtml(linkedDoc.code || linkedDoc.name)}</div></div>` : ''}
          </div>
          ${p.note ? `<div class="doc-desc">📝 ${escapeHtml(p.note)}</div>` : ''}
        </div>
        ${isAdmin ? `<div class="doc-row-actions" style="flex-direction:column; align-items:stretch;">
          <button class="btn btn-cyan btn-sm" title="${linkedDoc ? 'Thêm vòng trình mới (revision) cho hồ sơ này' : 'Tạo hồ sơ trình duyệt từ mục kế hoạch này'}" onclick="event.stopPropagation(); submitFromPlan('${p.id}')">📤 ${linkedDoc ? 'Trình lần mới' : 'Trình duyệt'}</button>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-ghost btn-icon" title="Sửa" onclick="event.stopPropagation(); openPlanModal('${p.id}')">✎</button>
            <button class="btn btn-danger btn-icon" title="Xóa" onclick="event.stopPropagation(); deletePlan('${p.id}')">🗑</button>
          </div>
        </div>` : ''}
        ${linkedDoc ? `<div class="chevron">›</div>` : ''}
      </div>
    </div>`;
}
function renderPlanView(){
  const list = scopedPlans().slice().sort((a,b)=> (a.plannedDate||'').localeCompare(b.plannedDate||''));
  const states = list.map(p=>({ p, s: planRowState(p) }));
  const lateCount = states.filter(x=>x.s.overdueVsPlan).length;
  const doneCount = states.filter(x=>x.s.isDone).length;
  const upcomingCount = states.filter(x=> !x.s.isDone && !x.s.overdueVsPlan && x.s.daysLeft<=7).length;

  let bodyHtml;
  if(states.length===0){
    bodyHtml = `<div class="empty-state"><div class="big">🗓️</div>Chưa có mục kế hoạch nào cho ${TYPE_META[currentType].label}${isAdmin ? '. Bấm "＋ Thêm mục kế hoạch" để bắt đầu.' : '.'}</div>`;
  } else {
    bodyHtml = `<div class="doc-list">${states.map(({p,s})=>renderPlanRow(p,s)).join('')}</div>`;
  }

  return `
    <div class="toolbar-row1" style="margin-bottom: 14px;">
      <button class="btn btn-cyan" onclick="forceUpdateData()">🔄 Làm mới kế hoạch</button>
    </div>
    <div class="scope-toggle">
      ${Object.keys(TYPE_META).map(t=>`<button class="scope-chip ${currentType===t?'active':''}" onclick="switchPlanType('${t}')">${TYPE_META[t].icon} ${TYPE_META[t].label}</button>`).join('')}
    </div>
    <div class="stat-kpi-row">
      <div class="stat-kpi"><div class="num">${states.length}</div><div class="lbl">Tổng mục kế hoạch</div></div>
      <div class="stat-kpi"><div class="num green">${doneCount}</div><div class="lbl">Đã hoàn thành</div></div>
      <div class="stat-kpi"><div class="num" style="color:var(--amber);">${upcomingCount}</div><div class="lbl">Sắp đến hạn (≤7 ngày)</div></div>
      <div class="stat-kpi"><div class="num danger">${lateCount}</div><div class="lbl">🔴 Trễ kế hoạch</div></div>
    </div>
    ${isAdmin ? `<div class="toolbar-row2" style="margin-bottom:14px;"><button class="btn btn-primary" onclick="openPlanModal()">＋ Thêm mục kế hoạch</button></div>` : ''}
    ${!isAdmin ? `<div class="guest-banner">👁️ Chế độ khách chỉ xem kế hoạch trình duyệt. <button class="link-btn" onclick="openLoginModal()">Đăng nhập Admin để thêm/sửa</button></div>` : ''}
    ${bodyHtml}
  `;
}

function refreshPlanGroupSelect(selectedGroupId){
  const sel = document.getElementById('planGroup');
  const defGroups = docTypeGroups(currentType);
  const options = defGroups.map(g=>`<option value="${g.id}" ${g.id===selectedGroupId?'selected':''}>${escapeHtml(g.name)}</option>`).join('');
  sel.innerHTML = `<option value="" ${!selectedGroupId?'selected':''}>— Không chọn nhóm —</option>` + options;
}
function refreshPlanMemberSelect(selectedMember){
  const sel = document.getElementById('planAssignee');
  const options = members.map(m=>`<option value="${escapeHtml(m)}" ${m===selectedMember?'selected':''}>${escapeHtml(m)}</option>`).join('');
  sel.innerHTML = `<option value="" ${!selectedMember?'selected':''}>— Chưa phân công —</option>` + options;
}
function refreshPlanLinkedDocSelect(selectedDocId){
  const sel = document.getElementById('planLinkedDoc');
  const list = scopedDocs();
  const options = list.map(d=>`<option value="${d.id}" ${d.id===selectedDocId?'selected':''}>${escapeHtml(d.code ? d.code+' — '+d.name : d.name)}</option>`).join('');
  sel.innerHTML = `<option value="" ${!selectedDocId?'selected':''}>— Không liên kết —</option>` + options;
  togglePlanManualStatus();
}
function togglePlanManualStatus(){
  const linkedId = document.getElementById('planLinkedDoc').value;
  document.getElementById('planManualStatusField').style.display = linkedId ? 'none' : 'block';

  const titleInput = document.getElementById('planTitle');
  const codeInput = document.getElementById('planCode');
  const groupSel = document.getElementById('planGroup');
  const titleLabel = document.getElementById('planTitleLabel');
  const codeLabel = document.getElementById('planCodeLabel');
  const groupLabel = document.getElementById('planGroupLabel');

  if(linkedId){
    const d = docs.find(x=>x.id===linkedId);
    if(d){
      titleInput.value = d.name;
      codeInput.value = d.code || '';
      groupSel.value = d.groupId || '';
    }
    titleInput.readOnly = true; codeInput.readOnly = true; groupSel.disabled = true;
    titleInput.style.background = 'var(--bg)'; codeInput.style.background = 'var(--bg)'; groupSel.style.background = 'var(--bg)';
    titleLabel.innerHTML = `Đầu mục / Tên công việc <span class="optional">(tự lấy theo hồ sơ liên kết)</span>`;
    codeLabel.innerHTML = `Mã tham chiếu <span class="optional">(tự lấy theo hồ sơ liên kết)</span>`;
    groupLabel.innerHTML = `Nhóm <span class="optional">(tự lấy theo hồ sơ liên kết)</span>`;
  } else {
    titleInput.readOnly = false; codeInput.readOnly = false; groupSel.disabled = false;
    titleInput.style.background = ''; codeInput.style.background = ''; groupSel.style.background = '';
    titleLabel.innerHTML = `Đầu mục / Tên công việc *`;
    codeLabel.innerHTML = `Mã tham chiếu <span class="optional">(không bắt buộc)</span>`;
    groupLabel.innerHTML = `Nhóm <span class="optional">(không bắt buộc)</span>`;
  }
}
function openPlanModal(id){
  if(!requireAdmin()) return;
  editingPlanId = id || null;
  const title = document.getElementById('planModalTitle');
  const titleInput = document.getElementById('planTitle');
  const codeInput = document.getElementById('planCode');
  const dateInput = document.getElementById('planDate');
  const noteInput = document.getElementById('planNote');

  if(id){
    const p = scopedPlans().find(x=>x.id===id);
    title.innerText = 'Sửa mục kế hoạch';
    titleInput.value = p.title;
    codeInput.value = p.code || '';
    dateInput.value = p.plannedDate;
    noteInput.value = p.note || '';
    refreshPlanGroupSelect(p.groupId);
    refreshPlanMemberSelect(p.assignee);
    refreshPlanLinkedDocSelect(p.linkedDocId);
    document.getElementById('planManualStatus').value = p.manualStatus || 'chua-trinh';
  } else {
    title.innerText = `Thêm mục kế hoạch ${TYPE_META[currentType].label}`;
    titleInput.value = ''; codeInput.value = ''; dateInput.value = todayIso(); noteInput.value = '';
    refreshPlanGroupSelect(null);
    refreshPlanMemberSelect(null);
    refreshPlanLinkedDocSelect(null);
    document.getElementById('planManualStatus').value = 'chua-trinh';
  }
  document.getElementById('planModal').classList.add('open');
  setTimeout(()=>titleInput.focus(), 50);
}
function savePlan(){
  if(!requireAdmin()) return;
  const title = document.getElementById('planTitle').value.trim();
  const code = document.getElementById('planCode').value.trim();
  const groupId = document.getElementById('planGroup').value;
  const plannedDate = document.getElementById('planDate').value;
  const linkedDocId = document.getElementById('planLinkedDoc').value;
  const manualStatus = document.getElementById('planManualStatus').value;
  const note = document.getElementById('planNote').value.trim();
  const assignee = document.getElementById('planAssignee').value;
  if(!title){ alert('Vui lòng nhập tên đầu mục.'); return; }
  if(!plannedDate){ alert('Vui lòng chọn ngày kế hoạch.'); return; }

  if(editingPlanId){
    const p = plans[currentType].find(x=>x.id===editingPlanId);
    p.title=title; p.code=code; p.groupId=groupId; p.plannedDate=plannedDate;
    p.linkedDocId=linkedDocId; p.manualStatus=manualStatus; p.note=note; p.assignee=assignee;
  } else {
    plans[currentType].push({ id: uid(), title, code, groupId, plannedDate, linkedDocId, manualStatus, note, assignee, createdAt: Date.now() });
  }
  if(linkedDocId){
    const linkedDoc = docs.find(x=>x.id===linkedDocId);
    if(linkedDoc && linkedDoc.rounds && linkedDoc.rounds.length>0){
      plans[currentType] = plans[currentType].filter(x=>x.linkedDocId!==linkedDocId);
    }
  }
  savePlans();
  closeModal('planModal');
  render();
  showToast('Đã lưu mục kế hoạch');
}
function deletePlan(id){

  plans[currentType] = plans[currentType].filter(x=>x.id!==id);

function submitFromPlan(id){
  if(!requireAdmin()) return;
  const p = plans[currentType].find(x=>x.id===id);
  if(!p) return;

  let doc = p.linkedDocId ? docs.find(x=>x.id===p.linkedDocId) : null;

  if(!doc){
    const nextStt = docs.length ? Math.max(...docs.map(x=>x.stt||0))+1 : 1;
    doc = {
      id: uid(), stt: nextStt, type: currentType,
      code: p.code || '', name: p.title, category: '', groupId: p.groupId || '',
      desc: p.note || '', assignee: p.assignee || '', rounds: []
    };
    docs.push(doc);
    saveDocs();
    p.linkedDocId = doc.id;
    savePlans();
    showToast('Đã tạo hồ sơ trình duyệt từ mục kế hoạch');
  }

  currentView = 'docs';
  currentType = doc.type;
  selectedId = doc.id;
  viewState = 'detail';
  render();
  openRoundModal(doc.id);
}

function renderDetailView(){
  const d = docs.find(x => x.id === selectedId);
  if(!d){ viewState='list'; return renderListView(); }

  const sorted = sortedRounds(d).reverse();
  const latest = sorted[0];
  const currentOverdue = latest ? overdueDays(latest) : 0;
  const approvedCount = (d.rounds||[]).filter(r=> overallStatus(r)==='da-duyet' || overallStatus(r)==='duyet-ghi-chu').length;

  let nodesHtml = '';
  if(sorted.length === 0){
    nodesHtml = `<div class="empty-state">Chưa có vòng trình duyệt nào cho hồ sơ này.</div>`;
  } else {
    sorted.forEach((r,idx)=>{
      const isLatest = latest && r.id === latest.id;
      const od = overdueDays(r);
      const ost = overallStatus(r);
      const st = STATUS_META[ost];
      const tvgsMeta = STATUS_META[r.tvgsStatus];
      const bqlMeta = STATUS_META[r.bqlStatus];
      const roundNo = sorted.length - idx;
      const deadline = addDays(r.submitDate, r.slaDays||7);

      nodesHtml += `
        <div class="round-node ${isLatest?'latest':''} ${od>0?'overdue':''}">
          <div class="round-dot"></div>
          <div class="round-card">
            <div class="round-card-top">
              <div class="round-badge-group">
                <span class="round-badge">Lần ${roundNo}</span>
                <span class="tag ${st.cls}">${st.icon} ${st.label}</span>
                ${isLatest ? '<span class="latest-tag">MỚI NHẤT</span>' : ''}
              </div>
              ${isAdmin ? `<div class="round-actions">
                <button class="btn btn-ghost btn-icon" title="Sửa" onclick="openRoundModal('${d.id}','${r.id}')">✎</button>
                <button class="btn btn-danger btn-icon" title="Xóa" onclick="deleteRound('${d.id}','${r.id}')">🗑</button>
              </div>` : ''}
            </div>
            <div class="round-grid">
              <div class="round-field"><div class="lbl">Ngày trình</div><div class="val">${fmtDate(r.submitDate)}</div></div>
              <div class="round-field"><div class="lbl">Hạn phản hồi</div><div class="val">${fmtDate(deadline)}</div></div>
              <div class="round-field"><div class="lbl">TVGS</div><div class="val">${tvgsMeta.icon} ${tvgsMeta.label}${r.tvgsDate?' · '+fmtDate(r.tvgsDate):''}</div></div>
              <div class="round-field"><div class="lbl">Ban quản lý</div><div class="val">${bqlMeta.icon} ${bqlMeta.label}${r.bqlDate?' · '+fmtDate(r.bqlDate):''}</div></div>
            </div>
            ${od>0 ? `<div class="round-overdue-note">🔴 Đã quá hạn phản hồi ${od} ngày (hạn: ${fmtDate(deadline)})</div>` : ''}
            ${r.note ? `<div class="round-note">${escapeHtml(r.note)}</div>` : ''}
            <div class="round-foot">
              <div class="round-links">
                ${r.fileLink ? `<a class="rlink" href="${escapeHtml(r.fileLink)}" target="_blank" rel="noopener noreferrer">📎 File trình</a><button class="copy-btn" data-url="${escapeHtml(r.fileLink)}" onclick="copyLink(this.dataset.url)">⧉</button>` : ''}
                ${r.tvgsLink ? `<a class="rlink approve" href="${escapeHtml(r.tvgsLink)}" target="_blank" rel="noopener noreferrer">🧭 Văn bản TVGS</a><button class="copy-btn" data-url="${escapeHtml(r.tvgsLink)}" onclick="copyLink(this.dataset.url)">⧉</button>` : ''}
                ${r.bqlLink ? `<a class="rlink approve" href="${escapeHtml(r.bqlLink)}" target="_blank" rel="noopener noreferrer">🏢 Văn bản BQL</a><button class="copy-btn" data-url="${escapeHtml(r.bqlLink)}" onclick="copyLink(this.dataset.url)">⧉</button>` : ''}
              </div>
            </div>
          </div>
        </div>`;
    });
  }

  return `
    <button class="back-btn" onclick="goBack()">← Quay lại danh mục</button>
    <div class="detail-card">
      <div class="detail-top">
        <div>
          <div class="detail-title-row">
            <span class="detail-code">${escapeHtml(d.code || '(chưa có mã)')}</span>
            <span class="detail-name">${escapeHtml(d.name)}</span>
            ${d.category ? `<span class="tag cat-tag">${escapeHtml(d.category)}</span>` : ''}
          </div>
          ${d.desc ? `<div class="detail-desc">${escapeHtml(d.desc)}</div>` : ''}
        </div>
        ${isAdmin ? `<div class="detail-actions">
          <button class="btn btn-ghost btn-sm" onclick="openDocModal('${d.id}')">✎ Sửa hồ sơ</button>
          <button class="btn btn-cyan btn-sm" onclick="openRoundModal('${d.id}')">＋ Thêm vòng trình</button>
        </div>` : ''}
      </div>
      <div class="detail-stats">
        <div class="dstat"><div class="num">${d.rounds?d.rounds.length:0}</div><div class="lbl">Lượt trình</div></div>
        <div class="dstat"><div class="num">${approvedCount}</div><div class="lbl">Lượt đã duyệt</div></div>
        <div class="dstat"><div class="num ${currentOverdue>0?'danger':''}">${currentOverdue>0 ? currentOverdue+' ngày' : 'Không'}</div><div class="lbl">Đang quá hạn</div></div>
      </div>
      ${currentOverdue>0 ? `<div class="overdue-banner">🔴 Hồ sơ đang quá hạn phản hồi ${currentOverdue} ngày — cần đôn đốc đơn vị chưa duyệt.</div>` : ''}

    <div class="timeline-head"><h3>Lịch sử trình duyệt</h3></div>
    <div class="round-timeline">${nodesHtml}</div>
  `;

function renameMember(oldName){
  if(!requireAdmin()) return;
  const name = prompt('Đổi tên thành viên:', oldName);
  if(!name || !name.trim()) return;
  const newName = name.trim();
  const index = members.indexOf(oldName);
  if(index > -1) members[index] = newName;
  docs.forEach(d=>{ if(d.assignee===oldName) d.assignee=newName; });
  plans.shopdrawing.forEach(p=>{ if(p.assignee===oldName) p.assignee=newName; });
  plans.bienphap.forEach(p=>{ if(p.assignee===oldName) p.assignee=newName; });
  saveMembers();
  saveDocs();
  savePlans();
  renderMemberManageList();
  render();
  showToast('Đã đổi tên thành viên');
}
function deleteMember(name){
  if(!requireAdmin()) return;
  const count = scopedDocs().filter(d=>d.assignee===name).length;
  if(!confirm(`Xóa thành viên "${name}"?${count ? ` ${count} hồ sơ của người này sẽ chuyển về "Chưa phân công".` : ''}`)) return;
  members = members.filter(x=>x!==name);
  docs.forEach(d=>{ if(d.assignee===name) d.assignee=''; });
  plans.shopdrawing.forEach(p=>{ if(p.assignee===name) p.assignee=''; });
  plans.bienphap.forEach(p=>{ if(p.assignee===name) p.assignee=''; });
  saveMembers();
  saveDocs();
  savePlans();
  renderMemberManageList();
  render();
  showToast('Đã xóa thành viên');
}

function saveDoc(){
  if(!requireAdmin()) return;
  const code = document.getElementById('docCode').value.trim();
  const name = document.getElementById('docName').value.trim();
  const category = document.getElementById('docCategory').value;
  const groupId = document.getElementById('docGroup').value;
  const desc = document.getElementById('docDesc').value.trim();
  const assignee = document.getElementById('docAssignee').value;
  if(!name){ alert('Vui lòng nhập tên bản vẽ / biện pháp.'); return; }

  if(editingDocId){
    const d = docs.find(x=>x.id===editingDocId);
    d.code = code; d.name = name; d.category = category; d.groupId = groupId; d.desc = desc; d.assignee = assignee;
  } else {
    const nextStt = docs.length ? Math.max(...docs.map(x=>x.stt||0))+1 : 1;
    const d = { id: uid(), stt: nextStt, type: currentType, code, name, category, groupId, desc, assignee, rounds: [] };
    docs.push(d);
    selectedId = d.id;
  }
  saveDocs();
  closeModal('docModal');
  render();
  showToast('Đã lưu hồ sơ');
}

function saveRound(){
  if(!requireAdmin()) return;
  const docId = document.getElementById('roundModal').dataset.docId;
  const isRevision = document.getElementById('roundModal').dataset.isRevision === '1';
  const d = docs.find(x=>x.id===docId);
  const submitDate = document.getElementById('roundSubmitDate').value;
  const slaDays = parseInt(document.getElementById('roundSla').value, 10) || settings.defaultSla || 7;
  const tvgsStatus = document.getElementById('tvgsStatus').value;
  const tvgsDate = document.getElementById('tvgsDate').value;
  const tvgsLink = document.getElementById('tvgsLink').value.trim();
  const bqlStatus = document.getElementById('bqlStatus').value;
  const bqlDate = document.getElementById('bqlDate').value;
  const bqlLink = document.getElementById('bqlLink').value.trim();
  const note = document.getElementById('roundNote').value.trim();
  const fileLink = document.getElementById('roundFileLink').value.trim();

  if(!submitDate){ alert('Vui lòng nhập ngày trình.'); return; }
  if(isRevision && !note){ alert('Vui lòng nhập lý do trình lại (bản vẽ đã thay đổi gì so với lần trước).'); return; }
  for(const [lbl, val] of [['Link file trình', fileLink], ['Link văn bản TVGS', tvgsLink], ['Link văn bản BQL', bqlLink]]){
    if(val && !/^https?:\/\//i.test(val)){ alert(`${lbl} cần bắt đầu bằng http:// hoặc https://`); return; }
  }

  if(!d.rounds) d.rounds = [];

  if(editingRoundId){
    const r = d.rounds.find(x=>x.id===editingRoundId);
    r.submitDate=submitDate; r.slaDays=slaDays;
    r.tvgsStatus=tvgsStatus; r.tvgsDate=tvgsDate; r.tvgsLink=tvgsLink;
    r.bqlStatus=bqlStatus; r.bqlDate=bqlDate; r.bqlLink=bqlLink;
    r.note=note; r.fileLink=fileLink;
  } else {
    d.rounds.push({ id: uid(), submitDate, slaDays, tvgsStatus, tvgsDate, tvgsLink, bqlStatus, bqlDate, bqlLink, note, fileLink, createdAt: Date.now() });
  }
  saveDocs();
  if(plans[d.type]){
    const before = plans[d.type].length;
    plans[d.type] = plans[d.type].filter(x=>x.linkedDocId!==d.id);
    if(plans[d.type].length!==before) savePlans();
  }
  closeModal('roundModal');
  currentView = 'docs'; currentType = d.type;
  selectedId = docId; viewState = 'detail';
  render();
  showToast('Đã lưu vòng trình duyệt');
}
function deleteRound(docId, roundId){
  if(!requireAdmin()) return;
  const d = docs.find(x=>x.id===docId);
  if(!confirm('Xóa vòng trình duyệt này?')) return;
  d.rounds = d.rounds.filter(x=>x.id!==roundId);
  saveDocs();
  render();
  showToast('Đã xóa vòng trình');
}

function openSettingsModal(){
  if(!requireAdmin()) return;
  document.getElementById('settingSlaShop').value = settings.defaultSla || 7;
  document.getElementById('settingsModal').classList.add('open');
}
function saveSettings(){
  if(!requireAdmin()) return;
  const v = parseInt(document.getElementById('settingSlaShop').value, 10);
  settings.defaultSla = v > 0 ? v : 7;
  saveSettingsData();
  closeModal('settingsModal');
  render();
  showToast('Đã lưu cấu hình');
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
  editingRoundId = null;
  editingDocId = null;
  editingPlanId = null;
}
document.querySelectorAll('.modal-overlay').forEach(ov=>{
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.classList.remove('open'); });
});

function csvEscape(v){
  const s = (v ?? '').toString();
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportCsv(){
  const list = filteredDocs();
  if(!list.length){ showToast('Không có dữ liệu để tải về'); return; }
  const headers = ['STT','Mã số','Tên bản vẽ/biện pháp','Nhóm','Hạng mục','Thành viên','Mô tả','Lần trình','Ngày trình','Hạn phản hồi','SLA (ngày)','Trạng thái TVGS','Ngày TVGS duyệt','Link văn bản TVGS','Trạng thái BQL','Ngày BQL duyệt','Link văn bản BQL','Ghi chú','Link file trình'];
  const rows = [headers];
  list.forEach(d=>{
    const g = d.groupId ? groupById(currentType, d.groupId) : null;
    const sorted = sortedRounds(d);
    if(sorted.length === 0){
      rows.push([d.stt, d.code||'', d.name, g?g.name:'', d.category||'', d.assignee||'', d.desc||'', '', '', '', '', '', '', '', '', '', '', '', '']);
    } else {
      sorted.forEach((r,idx)=>{
        const deadline = addDays(r.submitDate, r.slaDays||7);
        rows.push([
          d.stt, d.code||'', d.name, g?g.name:'', d.category||'', d.assignee||'', d.desc||'',
          idx+1, fmtDate(r.submitDate), fmtDate(deadline), r.slaDays||settings.defaultSla||7,
          STATUS_META[r.tvgsStatus]?.label||'', r.tvgsDate?fmtDate(r.tvgsDate):'', r.tvgsLink||'',
          STATUS_META[r.bqlStatus]?.label||'', r.bqlDate?fmtDate(r.bqlDate):'', r.bqlLink||'',
          r.note||'', r.fileLink||''
        ]);
      });
    }
  });
  const csvContent = '\uFEFF' + rows.map(row => row.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = todayIso();
  a.href = url;
  a.download = `${TYPE_META[currentType].label.replace(/\s+/g,'_')}_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Đã tải về file CSV');
}

function copyLink(link){
  if(!link) return;
  navigator.clipboard.writeText(link).then(()=> showToast('Đã sao chép link'))
    .catch(()=> showToast('Không thể sao chép, vui lòng copy thủ công'));
}

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.innerText = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

function resetAll(){
  if(!requireAdmin()) return;
  if(!confirm(`Xóa TOÀN BỘ hồ sơ ${TYPE_META[currentType].label} và lịch sử trình duyệt? Hành động này không thể hoàn tác.`)) return;
  docs = docs.filter(d=>d.type !== currentType);
  saveDocs();
  selectedId = null; viewState='list';
  render();
}
