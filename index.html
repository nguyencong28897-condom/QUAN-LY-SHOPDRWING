<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCC · Quản lý Shopdrawing & Biện pháp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { 
    --primary: #38BDF8; --primary-dark: #0284C7; --primary-light: #0369A1; 
    --cyan: #22D3EE; --bg: #0B0F19; --surface: #111827; --border: #374151; 
    --ink: #F9FAFB; --ink-light: #9CA3AF; --ink-faint: #6B7280; 
    --green: #34D399; --green-bg: #064E3B; --blue-bg: #1E3A8A; 
    --amber: #FBBF24; --amber-bg: #451A03; --teal: #2DD4BF; --teal-bg: #042F2E; 
    --gray-bg: #1F2937; --danger: #F87171; --danger-bg: #7F1D1D; --danger-dark: #FCA5A5; 
    --radius: 16px; 
  }

  [data-theme="light"] {
    --bg: #F3F4F6; --surface: #FFFFFF; --border: #D1D5DB; 
    --ink: #111827; --ink-light: #4B5563; --ink-faint: #9CA3AF; 
    --primary: #0284C7; --primary-dark: #0369A1; --primary-light: #E0F2FE;
    --cyan: #0891B2; --green: #059669; --green-bg: #D1FAE5;
    --blue-bg: #DBEAFE; --amber: #D97706; --amber-bg: #FEF3C7;
    --teal: #0D9488; --teal-bg: #CCFBF1; --gray-bg: #E5E7EB;
    --danger: #DC2626; --danger-bg: #FEE2E2; --danger-dark: #991B1B;
  }

  * { box-sizing: border-box; } 
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Manrope', sans-serif; min-height: 100vh; transition: background 0.3s, color 0.3s; }
  
  /* ... (Các định dạng css cũ - tôi ẩn bớt cho gọn, hãy dùng nguyên css của bản trước) ... */
  /* Do hạn chế về độ dài văn bản hiển thị trên màn hình chat, tôi xin phép bỏ qua phần CSS lặp lại không cần thiết để tập trung vào phần logic. Bạn cứ giữ nguyên thẻ <style> ở đoạn code HTML lần trước nhé! */

  /* CSS Bổ sung hoặc chỉnh sửa cho nút bấm RFI */
  .rfi-q-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 11px; font-weight: 800; color: var(--cyan); text-transform: uppercase; }
  .rfi-r-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 11.5px; font-weight: 800; color: var(--green); }
</style>
</head>
<body data-theme="dark">

  <!-- ... (Cấu trúc giao diện cơ bản) ... -->
  <div class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div class="brand">
          <div class="brand-mark">SD/BP</div>
          <div class="brand-text"><div class="eyebrow">NCC · Quản lý trình duyệt</div><h1>Shopdrawing & Biện pháp</h1></div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="btn btn-ghost" onclick="toggleTheme()" style="background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:16px; padding:6px 10px;" title="Đổi giao diện Ngày/Đêm">🌙</button>
          <div class="auth-area" id="authArea"></div>
        </div>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </div>
  </div>

  <div class="shell">
    <div class="tabs" id="tabsWrap"></div>
    <div id="appWrap"></div>
  </div>

  <!-- ... (Giữ nguyên các khối Modal cơ bản như Login, DocModal, PlanModal,...) ... -->
  <!-- Tôi chỉ show lại phần Modal của riêng RFI bên dưới -->

  <!-- MODAL RFI: SỬA MỤC HỎI CŨ -->
  <div class="modal-overlay" id="editItemModal"><div class="modal">
    <div class="modal-head"><h3>✎ Sửa Nội Dung Mục</h3><button class="modal-close" onclick="closeModal('editItemModal')">✕</button></div>
    <div class="modal-body">
      <div class="field"><label style="color: var(--cyan);">Nội dung vướng mắc *</label><textarea id="editItemQuestion" rows="3" placeholder="Nhập nội dung..."></textarea></div>
      <div class="field"><label>🔗 Liên kết bản vẽ</label><input type="text" id="editItemLinkedDoc" placeholder="Mã bản vẽ..."></div>
      <div class="field"><label>Đính kèm hình ảnh (Ctrl + V)</label>
        <div class="paste-area" id="pasteArea_edit" tabindex="0">
          <div class="paste-area-text" id="pasteHint_edit">🖱️ Click vào đây và bấm <b>Ctrl + V</b> để dán ảnh mới (sẽ ghi đè ảnh cũ)</div>
          <div class="pasted-preview-container" id="imagePreviewContainer_edit"><button class="remove-image-btn" onclick="removePastedImage('edit', event)">✕</button><img src="" id="pastedImagePreview_edit"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal('editItemModal')">Hủy</button><button class="btn btn-primary" onclick="saveEditedItem()">💾 Cập nhật Nội Dung</button></div>
  </div></div>

  <!-- MODAL RFI: CẬP NHẬT HOẶC SỬA TRẢ LỜI CHO TỪNG MỤC -->
  <div class="modal-overlay" id="replyModal"><div class="modal" style="max-width: 450px;">
    <div class="modal-head"><h3 id="replyModalTitle">✏️ Cập nhật Phản hồi</h3><button class="modal-close" onclick="closeModal('replyModal')">✕</button></div>
    <div class="modal-body">
      <div class="field"><label style="color: var(--green);">Nội dung phản hồi / Giải quyết *</label><textarea id="replyText" rows="4" placeholder="Nhập đáp án của TVGS hoặc biện pháp khắc phục..."></textarea></div>
      <div class="field"><label>Đính kèm hình ảnh phản hồi (Ctrl + V)</label>
        <div class="paste-area" id="pasteArea_reply" tabindex="0">
          <div class="paste-area-text" id="pasteHint_reply">🖱️ Click vào đây và bấm <b>Ctrl + V</b> để dán ảnh</div>
          <div class="pasted-preview-container" id="imagePreviewContainer_reply"><button class="remove-image-btn" onclick="removePastedImage('reply', event)">✕</button><img src="" id="pastedImagePreview_reply"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal('replyModal')">Hủy</button><button class="btn btn-primary" onclick="saveReply()">💾 Lưu Phản Hồi</button></div>
  </div></div>

  <div class="toast" id="toast"></div>

<script>
// (Giữ nguyên các hàm cốt lõi như loadAll(), parseRowsToDocs, setup... ở đây)
// TRỌNG TÂM LÀ HÀM RENDER RFI VÀ LOGIC NÚT BẤM

function renderRfiView() {
  let rfiHtml = rfis.length === 0 ? `<div class="empty-state">Chưa có ghi nhận vướng mắc nào.</div>` : rfis.map(r => {
    let overallStatusHtml = r.status === 'pending' ? `<span class="tag status-pending">⏳ Đang xử lý</span>` : `<span class="tag status-approved">✅ Đã đóng (Xong)</span>`;
    
    let itemsHtml = r.items.map((item, idx) => {
      let qThumb = item.qImage ? `<div class="rfi-thumb-wrapper"><img src="${escapeHtml(item.qImage)}" class="rfi-thumb" title="Bấm để phóng to" onclick="openLightbox('${escapeHtml(item.qImage)}')"></div>` : '';
      let rThumb = item.rImage ? `<div class="rfi-thumb-wrapper"><img src="${escapeHtml(item.rImage)}" class="rfi-thumb" title="Bấm để phóng to" onclick="openLightbox('${escapeHtml(item.rImage)}')"></div>` : '';
      let linkedDocTag = item.linkedDoc ? `<span class="tag" style="background: rgba(3, 105, 161, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3);">🔗 Tham chiếu: ${escapeHtml(item.linkedDoc)}</span>` : '';
      
      // LOGIC HIỂN THỊ NÚT SỬA CÂU HỎI
      // Chỉ cho phép Trưởng nhóm/Quản trị, hoặc chính người tạo RFI được sửa
      let editQuestionBtn = '';
      if (currentUser && (currentUser.role === 'manager' || currentUser.role === 'superadmin' || currentUser.name === r.author)) {
          editQuestionBtn = `<button class="btn btn-ghost btn-sm" onclick="openEditItemModal('${r.id}', '${item.id}', '${escapeHtml(item.question).replace(/'/g, "\\'")}', '${escapeHtml(item.linkedDoc).replace(/'/g, "\\'")}', '${escapeHtml(item.qImage).replace(/'/g, "\\'")}')">✎ Sửa mục này</button>`;
      }

      // LOGIC HIỂN THỊ PHẢN HỒI VÀ NÚT SỬA PHẢN HỒI
      let replyBox = '';
      if (item.reply) {
        // Đã có phản hồi: Hiện khung xanh
        // Nếu là Trưởng nhóm/Quản trị thì mới được sửa phản hồi
        let editReplyBtn = '';
        if (currentUser && (currentUser.role === 'manager' || currentUser.role === 'superadmin')) {
             editReplyBtn = `<button class="btn btn-ghost btn-sm" onclick="openReplyModal('${r.id}', '${item.id}', '${escapeHtml(item.reply).replace(/'/g, "\\'")}', '${escapeHtml(item.rImage).replace(/'/g, "\\'")}')">✎ Sửa trả lời</button>`;
        }
        
        replyBox = `
          <div class="rfi-reply">
            <div class="rfi-r-title">
              <span>Phản hồi (${item.replyDate}):</span>
              ${editReplyBtn}
            </div>
            <div class="rfi-r-text">${escapeHtml(item.reply)}</div>
            ${rThumb}
          </div>`;
      } else {
        // Chưa có phản hồi: Hiện khung vàng cảnh báo
        replyBox = `
          <div class="rfi-pending-reply">
            <span style="font-size:13px; font-weight:700; color:var(--amber);">⏳ Đang chờ trả lời...</span>
            ${currentUser ? `<button class="btn btn-primary btn-sm" onclick="openReplyModal('${r.id}', '${item.id}', '', '')">✏️ Cập nhật trả lời</button>` : ''}
          </div>`;
      }

      return `
        <div class="rfi-item">
          <div class="rfi-question">
            <div class="rfi-q-title">
                <div style="display:flex; align-items:center; gap:8px;">MỤC SỐ ${idx + 1} ${linkedDocTag}</div>
                ${editQuestionBtn}
            </div>
            <div class="rfi-q-text">${escapeHtml(item.question)}</div>
            ${qThumb}
          </div>
          ${replyBox}
        </div>`;
    }).join('');

    return `
      <div class="rfi-card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; border-bottom:1px dashed var(--border); padding-bottom:12px;">
          <div><div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;"><span class="doc-code" style="font-size: 15px; background: rgba(56, 189, 248, 0.15); border: 1px solid var(--primary);">${escapeHtml(r.code)}</span> <span style="font-weight:800; font-size:16px;">${escapeHtml(r.title)}</span></div><div style="font-size:12px; color:var(--ink-light); font-weight:700;">Ngày tạo: ${r.date} | Người tạo: ${escapeHtml(r.author)}</div></div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">${overallStatusHtml}</div>
        </div>
        <div class="rfi-item-list">${itemsHtml}</div>
        ${currentUser ? `<div style="margin-top:16px; text-align:center;"><button class="btn btn-ghost btn-sm" onclick="openAddItemModal('${r.id}')">＋ Bổ sung mục hỏi mới vào Công văn này</button></div>` : ''}
      </div>`;
  }).join('');

  return `<div class="toolbar-row1" style="margin-bottom: 24px; margin-top:20px;">
      <div class="search-box"><span>🔍</span><input type="text" placeholder="Tìm nội dung vướng mắc, mã bản vẽ..."></div>
      <button class="btn btn-cyan" onclick="forceUpdateData()">🔄 Đồng bộ</button>
      ${currentUser ? `<button class="btn btn-primary" onclick="openCreateRfiModal()">＋ Tạo Công văn / RFI mới</button>` : ''}
    </div><div class="rfi-timeline">${rfiHtml}</div>`;
}

// Logic mở form sửa (nhớ xóa ảnh đã paste tạm thời để tránh dính ảnh của form khác)
function openEditItemModal(rfiId, itemId, existingQuestion, existingLinkedDoc, existingQImage) {
  activeRfiId = rfiId; activeItemId = itemId;
  document.getElementById('editItemQuestion').value = existingQuestion || ''; 
  document.getElementById('editItemLinkedDoc').value = existingLinkedDoc || ''; 
  loadExistingImageToPasteArea('edit', existingQImage);
  document.getElementById('editItemModal').classList.add('open');
}

function openReplyModal(rfiId, itemId, existingReply, existingRImage) {
  activeRfiId = rfiId; activeItemId = itemId;
  document.getElementById('replyModalTitle').innerText = existingReply ? "✏️ Sửa Phản hồi" : "✏️ Cập nhật Phản hồi";
  document.getElementById('replyText').value = existingReply || ''; 
  loadExistingImageToPasteArea('reply', existingRImage);
  document.getElementById('replyModal').classList.add('open');
}
</script>
</body>
</html>
